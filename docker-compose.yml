# Production services for one server. See docs/deployment.md.
# All values come from .env. Only caddy publishes ports.
# The services postgres, redis, and caddy have a profile with the same name. COMPOSE_PROFILES in
# .env selects the profiles. Remove a profile for a managed service or another proxy.
name: store

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-medusa-environment: &medusa-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/medusa-store}
  DATABASE_SSL: ${DATABASE_SSL:-false}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  # STOREFRONT_URL and MEDUSA_BACKEND_URL are optional. The defaults come from DOMAIN.
  STORE_CORS: ${STOREFRONT_URL:-https://${DOMAIN}}
  ADMIN_CORS: ${MEDUSA_BACKEND_URL:-https://api.${DOMAIN}}
  AUTH_CORS: ${STOREFRONT_URL:-https://${DOMAIN}},${MEDUSA_BACKEND_URL:-https://api.${DOMAIN}}
  STOREFRONT_URL: ${STOREFRONT_URL:-https://${DOMAIN}}
  MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-https://api.${DOMAIN}}
  JWT_SECRET: ${JWT_SECRET}
  COOKIE_SECRET: ${COOKIE_SECRET}
  SHIPPING_RATE_PER_KG: ${SHIPPING_RATE_PER_KG}
  # An empty value gives the backend default. See docs/deployment.md.
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-}
  BANK_TRANSFER_ENABLED: ${BANK_TRANSFER_ENABLED:-}
  BANK_TRANSFER_DEADLINE_HOURS: ${BANK_TRANSFER_DEADLINE_HOURS:-}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_SECURE: ${SMTP_SECURE}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  EMAIL_FROM: ${EMAIL_FROM}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
  STORE_OWNER_EMAIL: ${STORE_OWNER_EMAIL}
  # The S3 store of your provider. The template runs no S3 service in production.
  S3_BUCKET: ${S3_BUCKET}
  S3_RECEIPTS_BUCKET: ${S3_RECEIPTS_BUCKET}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
  S3_REGION: ${S3_REGION}
  S3_FILE_URL: ${S3_FILE_URL}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

# required: false lets the Medusa services start when a profile turns off postgres or redis.
x-medusa-depends-on: &medusa-depends-on
  postgres:
    condition: service_healthy
    required: false
  redis:
    condition: service_healthy
    required: false

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: medusa-store
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medusa-store"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  medusa-server:
    image: store-backend
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-https://api.${DOMAIN}}
    restart: unless-stopped
    environment:
      <<: *medusa-environment
      MEDUSA_WORKER_MODE: server
      DISABLE_MEDUSA_ADMIN: "false"
    depends_on: *medusa-depends-on
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *logging

  # The worker uses the image that the medusa-server build makes. It has no build block.
  medusa-worker:
    image: store-backend
    pull_policy: never
    restart: unless-stopped
    environment:
      <<: *medusa-environment
      MEDUSA_WORKER_MODE: worker
      DISABLE_MEDUSA_ADMIN: "true"
    depends_on: *medusa-depends-on
    logging: *logging

  storefront:
    image: store-storefront
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-https://api.${DOMAIN}}
      NUXT_MEDUSA_BACKEND_URL: http://medusa-server:9000
      NUXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY:-}
      NUXT_PUBLIC_SITE_URL: ${STOREFRONT_URL:-https://${DOMAIN}}
    depends_on:
      - medusa-server
    logging: *logging

  caddy:
    image: caddy:2.11
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      STOREFRONT_URL: ${STOREFRONT_URL:-https://${DOMAIN}}
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-https://api.${DOMAIN}}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - storefront
      - medusa-server
    logging: *logging

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
